# System risk tiers that determine mandatory telemetry.
# Source: ORF Technical Paper, Section 7.3 "Risk Tiering".

low:
  name: "Low-Risk Operations"
  description: >-
    Beta testing, internal pilots, and proofs of concept where the impact of
    failure is limited and human-in-the-loop oversight is strong. Internal
    experimentation by a single team to prototype a new use case, where outputs
    are not used to inform downstream decisions, falls into this tier.

medium:
  name: "Medium-Risk Operations"
  description: >-
    Internal agency usage with minimal impact on operations, and low-impact
    public-facing use cases with strong human-in-the-loop oversight. An internal
    scoping assistant used by public officers to draft documents, with all
    outputs reviewed before use, is a representative example.

high:
  name: "High-Risk Operations"
  description: >-
    Systems with significant operational impact and high-impact public-facing
    deployments. Public-facing chatbots that answer questions on consequential
    domains such as housing, taxation, or social support, and agentic systems
    that take actions against external services on behalf of citizens, fall into
    this tier.

# Note: Risk tier is the primary determinant of mandatory telemetry, but data
# classification interacts with risk in practice. A low-risk system that
# processes high-classification data inherits stricter handling requirements for
# its telemetry; a high-risk system handling only public information may have
# stricter logging needs but laxer storage requirements. Agencies should conduct
# a parallel data-handling assessment alongside the risk-tier determination.
